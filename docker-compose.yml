# Local / CI stack: source Postgres + MinIO lake + the ETL job.
# Secrets come from .env (git-ignored); see .env.example.
#   docker compose up -d --wait postgres minio createbucket
#   docker compose run --rm etl                      (all layers)
#   docker compose run --rm --no-deps -e LAYER=silver etl   (one layer; see scripts/run_layer.*)
#   docker compose run --rm reports     (site/ from the lake)
name: acme-talent-etl

x-minio-image: &minio-image cgr.dev/chainguard/minio@sha256:709099319add48dfb44aa596a7070d3ddd8dd04d7ae881765719aec29df9e510

services:
  postgres:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    environment:
      POSTGRES_DB: ${POSTGRES_NAME:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASS:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/generated:/data/generated:ro
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5544}:5432"
    healthcheck:
      # TCP check: only passes once init (schema + data load) has finished and the real server is up
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 40

  minio:
    image: *minio-image
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@127.0.0.1:9000
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 30

  createbucket:
    image: *minio-image
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
      LAKE_BUCKET: ${LAKE_BUCKET:?set in .env}
    entrypoint: ["/bin/sh", "-c", "mc mb --ignore-existing local/$$LAKE_BUCKET"]
    restart: "no"

  etl:
    build:
      context: .
      target: runtime
    image: acme-talent-etl:local
    profiles: ["etl"]
    # bronze needs Postgres; run silver/gold with `docker compose run --no-deps` (MinIO only)
    depends_on:
      postgres:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
    # ETL_UID/ETL_GID let Linux hosts (CI) own files written to the lake-state mount
    user: "${ETL_UID:-10001}:${ETL_GID:-10001}"
    environment:
      HOME: /tmp
      LAYER: ${LAYER:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_NAME: ${POSTGRES_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASS: ${POSTGRES_PASS}
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      LAKE_BUCKET: ${LAKE_BUCKET}
      EVENTS_SOURCE_DIR: /data/learning_activity
      STEPS: ${STEPS:-extract,bronze,silver,gold}
      RUN_DATE: ${RUN_DATE:-}
      EXECUTION_ENV: ${EXECUTION_ENV:-docker}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data/generated/learning_activity:/data/learning_activity:ro
      # lake export/import (python job.py --export-lake/--import-lake /lake-state), used to hand the lake between CI jobs
      - ${LAKE_STATE_DIR:-./.lake-state}:/lake-state

  # Synthetic source data -> ./data/generated (docker compose run --rm datagen --seed 7 --employees 500).
  # Postgres loads it once, on an empty volume: after regenerating, reset the volumes.
  datagen:
    image: acme-talent-etl:local
    profiles: ["etl"]
    user: "${ETL_UID:-10001}:${ETL_GID:-10001}"
    environment:
      HOME: /tmp
    entrypoint: ["python", "scripts/generate_data.py"]
    volumes:
      - ./data:/app/data

  reports:
    build:
      context: .
      target: reports
    image: acme-talent-etl-reports:local
    profiles: ["etl"]
    depends_on:
      minio:
        condition: service_healthy
    # SITE_UID/SITE_GID let Linux hosts (CI) own the files written to ./site
    user: "${SITE_UID:-10001}:${SITE_GID:-10001}"
    environment:
      HOME: /tmp
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      LAKE_BUCKET: ${LAKE_BUCKET}
      SKIP_NOTEBOOK: ${SKIP_NOTEBOOK:-0}
    volumes:
      - ./site:/app/site

volumes:
  pgdata:
  miniodata:
