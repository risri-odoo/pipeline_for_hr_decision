# ACME Talent ETL: three layer jobs (bronze -> silver -> gold), then publish site/ to GitHub Pages.
#
# Each job runs on a fresh runner with its own Postgres/MinIO (docker compose). The lake is handed
# from job to job as an artifact: a job imports the previous job's lake export, runs its layer and
# exports the whole lake again ("lake-after-<layer>", kept 7 days). Running one layer alone
# (workflow_dispatch, layer=silver/gold) restores the newest lake-after-* artifact from an earlier run.
name: pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      layer:
        description: Layer(s) to run
        type: choice
        options: [all, bronze, silver, gold]
        default: all

permissions:
  contents: read
  actions: read # download lake state saved by earlier runs

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  EXECUTION_ENV: github-actions
  LAKE_STATE_DIR: ./lake-state
  STATE_RETENTION_DAYS: 7

jobs:
  bronze:
    if: github.event_name != 'workflow_dispatch' || inputs.layer == 'all' || inputs.layer == 'bronze'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Let containers write as the runner user
        run: |
          { echo "ETL_UID=$(id -u)"; echo "ETL_GID=$(id -g)"; echo "SITE_UID=$(id -u)"; echo "SITE_GID=$(id -g)"; } >> "$GITHUB_ENV"
      - name: Bronze layer (generates the synthetic data, then extract + bronze)
        run: EXPORT_STATE=1 SKIP_SITE=1 scripts/run_layer.sh bronze
      - uses: actions/upload-artifact@v7
        with:
          name: lake-after-bronze
          path: lake-state
          retention-days: ${{ env.STATE_RETENTION_DAYS }}
          if-no-files-found: error

  silver:
    needs: bronze
    # Runs after a successful bronze in a full run, or alone when layer=silver was picked.
    # A failed bronze never lets silver run (a skipped bronze only counts when silver was picked alone).
    if: >-
      !cancelled() && (
        (needs.bronze.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.layer == 'all')) ||
        (needs.bronze.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.layer == 'silver')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Let containers write as the runner user
        run: |
          { echo "ETL_UID=$(id -u)"; echo "ETL_GID=$(id -g)"; echo "SITE_UID=$(id -u)"; echo "SITE_GID=$(id -g)"; } >> "$GITHUB_ENV"
      - name: Locate input lake state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci_find_state.sh "${{ needs.bronze.result }}" lake-after-bronze
      - uses: actions/download-artifact@v8
        with:
          name: ${{ steps.state.outputs.name }}
          path: lake-state
          run-id: ${{ steps.state.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Silver layer
        run: IMPORT_STATE=1 EXPORT_STATE=1 SKIP_SITE=1 scripts/run_layer.sh silver
      - uses: actions/upload-artifact@v7
        with:
          name: lake-after-silver
          path: lake-state
          retention-days: ${{ env.STATE_RETENTION_DAYS }}
          if-no-files-found: error

  gold:
    needs: silver
    outputs:
      deployable: ${{ steps.gate.outputs.deployable }}
    # Runs after a successful silver in a full run, or alone when layer=gold was picked.
    # A failed bronze or silver never lets gold run (a skipped silver only counts when gold was picked alone).
    if: >-
      !cancelled() && (
        (needs.silver.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.layer == 'all')) ||
        (needs.silver.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.layer == 'gold')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Let containers write as the runner user
        run: |
          { echo "ETL_UID=$(id -u)"; echo "ETL_GID=$(id -g)"; echo "SITE_UID=$(id -u)"; echo "SITE_GID=$(id -g)"; } >> "$GITHUB_ENV"
      - name: Locate input lake state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci_find_state.sh "${{ needs.silver.result }}" lake-after-silver
      - uses: actions/download-artifact@v8
        with:
          name: ${{ steps.state.outputs.name }}
          path: lake-state
          run-id: ${{ steps.state.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Gold layer + site
        run: IMPORT_STATE=1 EXPORT_STATE=1 scripts/run_layer.sh gold
      - name: Deploy gate (SUCCEEDED and 9/9)
        id: gate
        if: always()
        run: python3 scripts/ci_gate.py site/lineage.json
      - uses: actions/upload-artifact@v7
        with:
          name: lake-after-gold
          path: lake-state
          retention-days: ${{ env.STATE_RETENTION_DAYS }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site
          path: site
          retention-days: ${{ env.STATE_RETENTION_DAYS }}
          if-no-files-found: ignore
      - name: Package site/ for GitHub Pages
        if: steps.gate.outputs.deployable == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    # GitHub Pages (one-time setup: Settings > Pages > Source = "GitHub Actions").
    # Deploys only from main, only when bronze, silver and gold all succeeded in this run,
    # and only when the gold job's gate says the pipeline SUCCEEDED with 9/9 checks.
    needs: [bronze, silver, gold]
    if: >-
      needs.bronze.result == 'success' && needs.silver.result == 'success' && needs.gold.result == 'success' &&
      needs.gold.outputs.deployable == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
